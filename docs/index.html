<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<title>川麻助手 v0.3 · PWA</title>
<style>
:root { --n:#4c78a8; --d:#f58518; --q:#54a24b; --f:#b279a2; --bg:#eef0f3; --line:#d8dce2; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; background: var(--bg); color: #222; font-size: 15px; }
.wrap { max-width: 760px; margin: 0 auto; padding: 8px 8px 190px; }
.meta { color: #777; font-size: .8rem; }

/* ---- 顶部推荐横幅 ---- */
#banner { position: sticky; top: 0; z-index: 30; background: #fff; border-bottom: 1px solid var(--line); padding: 8px 10px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
#banner .in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
#banner .tag { font-weight: 700; }
#banner .ev { color: #555; }

/* ---- 玩家卡 ---- */
.seat { background: #fff; border-radius: 10px; margin: 8px 0; border: 1px solid var(--line); overflow: hidden; }
.seat.me { border-color: #b8cce0; box-shadow: 0 1px 5px rgba(76,120,168,.12); }
.seat-head { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: #f7f8fa; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.seat-head .nm { font-weight: 700; }
.seat-head select { padding: 4px 6px; font-size: .85rem; border-radius: 6px; border: 1px solid var(--line); background: #fff; }
.zone { padding: 6px 10px; border-bottom: 1px dashed #eceff2; }
.zone:last-child { border-bottom: none; }
.zone-label { font-size: .75rem; color: #999; margin-bottom: 3px; display: flex; justify-content: space-between; align-items: center; }

/* ---- 牌块通用 ---- */
.tiles { display: flex; flex-wrap: wrap; gap: 3px; min-height: 30px; align-items: center; }
.p { width: 26px; height: 36px; border: 1px solid #c6ccd4; border-radius: 4px; background: #fff;
     display: inline-flex; align-items: center; justify-content: center; font-size: 1.15rem; cursor: pointer; padding: 0; }
.p:active { background: #e8f0fe; }
.p.back { background: #dfe7ef; color: transparent; }            /* 暗杠背牌 */
.chip { display: inline-flex; gap: 2px; background: #eaf1f8; border-radius: 6px; padding: 2px 4px; margin: 1px; cursor: pointer; }
.chip .k { font-size: .68rem; color: #667; align-self: center; margin-right: 2px; }
.mini-undo { font-size: .75rem; color: #4c78a8; background: none; border: none; cursor: pointer; padding: 2px 4px; }

/* ---- 信念网格（对手手牌区） ---- */
.belief-grid { display: flex; gap: 4px; align-items: center; }
.belief-grid .suitlab { width: 1.1em; font-size: .8rem; color: #888; }
.bg-row { display: flex; gap: 2px; flex: 1; }
.bg-cell { flex: 1; height: 34px; border-radius: 4px; background: #dbe7f3; position: relative;
          display: flex; align-items: center; justify-content: center; font-size: .95rem; cursor: default; }
.bg-cell .e { position: absolute; bottom: 1px; right: 3px; font-size: .62rem; color: #357; }
.bg-cell.na { background: #f0f2f4; color: #c0c4c9; }
.mapline { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; align-items: center; }

/* ---- 底部牌盘 ---- */
#palette { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: #fdfdfd; border-top: 1px solid var(--line); box-shadow: 0 -2px 8px rgba(0,0,0,.08); }
#palette .in { max-width: 760px; margin: 0 auto; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
#modes { display: flex; gap: 4px; margin-bottom: 5px; flex-wrap: wrap; align-items: center; }
#modes button { flex: 1; min-width: 52px; padding: 7px 2px; font-size: .82rem; border-radius: 7px; border: 1px solid var(--line); background: #f2f4f6; cursor: pointer; }
#modes button.on { background: #4c78a8; color: #fff; border-color: #4c78a8; font-weight: 600; }
#meldCfg { display: none; gap: 4px; margin-bottom: 5px; align-items: center; }
#meldCfg.show { display: flex; }
#meldCfg select { padding: 6px 4px; font-size: .85rem; border-radius: 7px; border: 1px solid var(--line); background: #fff; }
.prow { display: flex; gap: 4px; margin: 3px 0; align-items: center; }
.prow .suitlab { width: 1.2em; font-size: .85rem; color: #888; }
.tp { flex: 1; position: relative; border: 1px solid #c6ccd4; border-radius: 6px; background: #fff;
      height: 46px; display: flex; align-items: center; justify-content: center; font-size: 1.35rem; cursor: pointer; padding: 0; }
.tp .cnt { position: absolute; top: 1px; right: 3px; font-size: .66rem; color: #789; }
.tp.zero { opacity: .32; }
.tp.hot { border-color: #54a24b; box-shadow: 0 0 0 2px rgba(84,162,75,.4); }
.tp.cut { border-color: #e45756; box-shadow: 0 0 0 2px rgba(228,87,86,.4); }
/* 危险度五级（defense.py 聚合值）：蓝 <5% · 黄 5-10% · 红 10-15% · 深红 >15% */
.tp.dg1 { border-bottom: 4px solid #7aa5d8; }
.tp.dg2 { border-bottom: 4px solid #e8c34a; }
.tp.dg3 { border-bottom: 4px solid #e45756; }
.tp.dg4 { border-bottom: 4px solid #8b1a1a; }
.tenpai-badge { color: #b3382f; font-weight: 700; font-size: .78rem; }

/* ---- 分析详情 ---- */
details.sec { background: #fff; border-radius: 10px; margin: 8px 0; border: 1px solid var(--line); }
details.sec > summary { padding: 10px 12px; font-weight: 600; cursor: pointer; list-style: none; }
details.sec > summary::-webkit-details-marker { display: none; }
.sec-body { padding: 0 12px 10px; }
.plan-card { border-left: 5px solid #ccc; background: #fafafa; border-radius: 6px; padding: 8px 10px; margin: 8px 0; }
.plan-card.best { background: #f0f7ee; }
.plan-head { display: flex; justify-content: space-between; font-weight: 600; font-size: .88rem; flex-wrap: wrap; gap: 4px; }
.bar-wrap { background: #e3e6ea; border-radius: 4px; height: 14px; margin: 6px 0; overflow: hidden; }
.bar { height: 100%; border-radius: 4px; }
.rank-row { display: flex; align-items: center; gap: 6px; margin: 3px 0; font-size: .82rem; }
.rank-row .barw { flex: 1; background: #e3e6ea; border-radius: 4px; height: 12px; overflow: hidden; }
.rank-row .barf { height: 100%; }
h1 { font-size: 1.05rem; margin: 6px 4px; }
#status { font-size: .78rem; color: #98a; }

#loading { position: fixed; inset: 0; z-index: 100; background: rgba(246,247,249,.96);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
#loading .spin { width: 38px; height: 38px; border: 4px solid #cdd6e0; border-top-color: #4c78a8;
  border-radius: 50%; animation: mjspin 1s linear infinite; }
@keyframes mjspin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="loading"><div class="spin"></div>
  <div>正在加载川麻引擎（首次约几秒）…</div><div id="loadmsg" class="meta">初始化 Pyodide…</div>
</div>

<div id="banner"><div class="in">
  <span>🀄 川麻助手 <span class="meta">v0.3</span></span>
  <span id="rec" class="tag">录入手牌后自动分析…</span>
  <span id="status"></span>
</div></div>

<div class="wrap">
  <h1 style="display:none">川麻助手</h1>

  <details class="sec" id="gameSec">
    <summary>🎮 对局记录 <span class="meta" id="gstat">动作流水录入 → 一键导出 M 记录复盘</span></summary>
    <div class="sec-body">
      <div class="row" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0">
        <label class="meta">庄家
          <select id="gdealer"><option value="0">我</option><option value="1">下家</option><option value="2">对家</option><option value="3">上家</option></select>
        </label>
        <button id="gstart" class="mini-undo" style="border:1px solid var(--line);border-radius:7px;padding:7px 12px">新开一局（用当前 13 张手牌）</button>
        <button id="gexit" class="mini-undo" style="border:1px solid var(--line);border-radius:7px;padding:7px 12px">退出对局</button>
      </div>
      <div class="meta">开局后底部牌盘变为动作录入：我摸/我出/各家出；碰杠胡用下方按钮。对手定缺取各家卡上的定缺选择。</div>
      <div id="gbar" style="margin:8px 0"></div>
      <div id="gout"></div>
    </div>
  </details>

  <div id="seats"></div>

  <details class="sec" id="anaSec">
    <summary>📊 计划明细与牌效 <span class="meta" id="lat"></span></summary>
    <div class="sec-body">
      <div class="row" style="display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap">
        <label class="meta">分析精度
          <select id="k"><option value="20">快(20)</option><option value="40" selected>标准(40)</option><option value="100">精(100)</option></select>
        </label>
        <label class="meta">读牌精度
          <select id="ki"><option value="100">快(100)</option><option value="300" selected>标准(300)</option><option value="600">精(600)</option></select>
        </label>
        <button id="go" class="mini-undo" style="border:1px solid var(--line);border-radius:7px;padding:7px 14px">立即分析</button>
      </div>
      <div id="plans"></div>
      <div class="meta">口径：v1.9 引擎（碰杠开 / 官方累加计分 / 哑对手）· EV=每手期望分（和牌+杠租）</div>
      <div class="meta">牌盘底边=危险度（基于对手 MAP 听牌估计）：蓝 &lt;5% · 黄 5-10% · 红 10-15% · 深红 &gt;15%；现物/筋已折算</div>
    </div>
  </details>
</div>

<div id="palette"><div class="in">
  <div id="modes">
    <button data-m="hand" class="on">我·手牌</button>
    <button data-m="myriver">我·出</button>
    <button data-m="or0">对·出</button>
    <button data-m="or1">下·出</button>
    <button data-m="or2">上·出</button>
    <button data-m="meld">副露</button>
  </div>
  <div id="meldCfg">
    <select id="meldSeat"><option value="me">我</option><option value="0">对家</option><option value="1">下家</option><option value="2">上家</option></select>
    <select id="meldKind"><option value="peng">碰</option><option value="gang">明杠</option><option value="angang">暗杠</option></select>
    <span class="meta">点上方牌盘选张</span>
  </div>
  <div id="ptiles"></div>
</div></div>


<script>
// ---- Pyodide 胶水（由 make_pwa.py 注入；static 源不含本段） ----
let pyodideReady = false;
async function boot(){
  try {
    const pyodide = await loadPyodide();
    window._py = pyodide;
    document.getElementById("loadmsg").textContent = "解包引擎中…";
    const buf = await (await fetch("mahjong.zip?v=e30e-78ab95c3")).arrayBuffer();
    pyodide.unpackArchive(new Uint8Array(buf), "zip");
    pyodide.runPython(`
import sys, json
for p in ("/", ".", "/home/pyodide"):
    if p not in sys.path:
        sys.path.insert(0, p)
from mahjong.assistant import analyze as _analyze
from mahjong.belief import infer_summary as _infer_summary
from mahjong.tiles import counts_of as _counts_of

def _melds(ms):
    return [(m["kind"], int(m["tile"])) for m in ms]

def analyze_json(s):
    d = json.loads(s)
    r = _analyze([int(t) for t in d["tiles"]], d.get("que"), int(d.get("k", 20)),
                 melds=_melds(d.get("melds", [])))
    return json.dumps(r, ensure_ascii=False)

def infer_json(s):
    d = json.loads(s)
    r = _infer_summary(_counts_of([int(t) for t in d["tiles"]]), _melds(d.get("melds", [])),
                       [[int(t) for t in rv] for rv in d.get("rivers", [[], [], []])],
                       [_melds(ms) for ms in d.get("opp_melds", [[], [], []])],
                       d.get("ques", [None, None, None]),
                       k=int(d.get("k", 300)),
                       my_river=[int(t) for t in d.get("my_river", [])])
    return json.dumps(r, ensure_ascii=False)

from mahjong.recorder import RecorderSession as _RS

def _rec_session(d):
    sess = _RS([int(t) for t in d["my_tiles"]], int(d["my_que"]), int(d.get("dealer", 0)))
    for a in d.get("actions", []):
        sess.act(a)
    return sess

def rec_state_json(s):
    d = json.loads(s)
    return json.dumps({"state": _rec_session(d).state()}, ensure_ascii=False)

def rec_export_json(s):
    d = json.loads(s)
    try:
        return json.dumps({"record": _rec_session(d).export(k_infer=int(d.get("k", 300)))}, ensure_ascii=False)
    except ValueError as e:
        return json.dumps({"error": str(e)}, ensure_ascii=False)
`);
    window._analyzeJson = (s) => JSON.parse(pyodide.globals.get("analyze_json")(JSON.stringify(s)));
    window._inferJson = (s) => JSON.parse(pyodide.globals.get("infer_json")(JSON.stringify(s)));
    window._recStateJson = (s) => JSON.parse(pyodide.globals.get("rec_state_json")(JSON.stringify(s)));
    window._recExportJson = (s) => JSON.parse(pyodide.globals.get("rec_export_json")(JSON.stringify(s)));
    pyodideReady = true;
    document.getElementById("loading").style.display = "none";
  } catch (e) {
    document.getElementById("loadmsg").textContent = "加载失败：" + e.message + "（请检查网络后刷新）";
  }
}
</script>

<script>
"use strict";
const SUITS = ["条","饼","万"];
const RANKS = ["一","二","三","四","五","六","七","八","九"];
const TILE_STR = [];
for (let s = 0; s < 3; s++) for (let r = 0; r < 9; r++) TILE_STR.push(SUITS[s] + RANKS[r]);
const PLAN_CN = {normal:"平胡", dazi:"大对子", qidui:"七对", flush:"清一色"};
const PLAN_CSS = {normal:"var(--n)", dazi:"var(--d)", qidui:"var(--q)", flush:"var(--f)"};
const KIND_CN = {peng:"碰", gang:"明杠", angang:"暗杠", jiagang:"加杠"};
// 显示顺序：对家/下家/上家（opp index 0/1/2），我
const OPP_CN = ["对家","下家","上家"];

let hand = [];                 // 我的手牌（排序）
let myMelds = [];              // 我的副露 [{kind,tile}]
let myRiver = [];              // 我的牌河
let opps = [                   // 三家：牌河/副露手动，手牌由信念计算
  {river: [], melds: [], que: null, belief: null},
  {river: [], melds: [], que: null, belief: null},
  {river: [], melds: [], que: null, belief: null},
];
let myQue = null;
let mode = "hand";             // hand | myriver | or0..2 | meld
let lastAna = null;
let lastDanger = null;         // 最近一次读牌的 danger 字段
let lastRecText = "录入手牌后自动分析…";

function tileFace(t){ // Unicode 牌面：条 0x1F010，饼 0x1F019，万 0x1F007
  const base = t < 9 ? 0x1F010 : t < 18 ? 0x1F019 : 0x1F007;
  return String.fromCodePoint(base + (t % 9));
}
function tileName(t){ return TILE_STR[t]; }
function expectedIdle(){ // 含副露应持：13+杠−3碰−4杠（引擎口径，加杠由 gang 计）
  const p = myMelds.filter(m => m.kind === "peng").length;
  const g = myMelds.length - p;
  return 13 + g - 3 * p - 4 * g;
}
function meldSize(k){ return k === "peng" ? 3 : 4; }
function visibleCnt(t){ // 全场已见张数（估牌山剩余用）
  let n = hand.filter(x => x === t).length + myRiver.filter(x => x === t).length;
  for (const m of myMelds) if (m.tile === t) n += meldSize(m.kind);
  for (const o of opps){
    n += o.river.filter(x => x === t).length;
    for (const m of o.melds) if (m.tile === t) n += meldSize(m.kind);
  }
  return n;
}

// ---------- 渲染：四家 ----------
function pBtn(t, onclick, extra){
  const b = document.createElement("button");
  b.className = "p" + (extra || "");
  b.textContent = tileFace(t);
  b.title = tileName(t);
  if (onclick) b.onclick = onclick;
  return b;
}
function chipEl(label, tiles, onclickRemove){
  const c = document.createElement("span");
  c.className = "chip";
  const k = document.createElement("span");
  k.className = "k"; k.textContent = label;
  c.appendChild(k);
  tiles.forEach(t => c.appendChild(pBtn(t)));
  c.onclick = onclickRemove;
  return c;
}
function zone(label, rightEl){
  const z = document.createElement("div");
  z.className = "zone";
  const lab = document.createElement("div");
  lab.className = "zone-label";
  const s = document.createElement("span"); s.textContent = label;
  lab.appendChild(s);
  if (rightEl) lab.appendChild(rightEl);
  z.appendChild(lab);
  return z;
}
function queSelect(val, cb){
  const sel = document.createElement("select");
  [["","定缺?"],["0","条"],["1","饼"],["2","万"]].forEach(([v, n]) => {
    const o = document.createElement("option");
    o.value = v; o.textContent = n;
    if (String(val ?? "") === v) o.selected = true;
    sel.appendChild(o);
  });
  sel.onchange = () => cb(sel.value === "" ? null : +sel.value);
  return sel;
}

function renderOppSeat(i){
  const o = opps[i];
  const seat = document.createElement("div");
  seat.className = "seat";
  // 头
  const head = document.createElement("div");
  head.className = "seat-head";
  const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = OPP_CN[i];
  head.appendChild(nm);
  head.appendChild(queSelect(o.que, v => { o.que = v; scheduleInfer(); }));
  const meta = document.createElement("span"); meta.className = "meta";
  meta.id = "ometa" + i;
  meta.textContent = o.belief ? `有效样本 ${o.belief.neff} ｜ MAP权重 ${o.belief.map_weight}` : "点牌河录入后自动读牌";
  head.appendChild(meta);
  seat.appendChild(head);
  // 手牌（信念）
  const hz = zone("手牌（推断）");
  const bg = document.createElement("div");
  bg.className = "belief-grid";
  bg.id = "belief" + i;
  hz.appendChild(bg);
  const mapline = document.createElement("div");
  mapline.className = "mapline";
  mapline.id = "mapline" + i;
  hz.appendChild(mapline);
  seat.appendChild(hz);
  // 副露
  const mz = zone("副露", undoClr(() => o.melds.pop(), () => { o.melds = []; renderSeats(); }));
  const mtiles = document.createElement("div");
  mtiles.className = "tiles";
  o.melds.forEach((m, j) => {
    const ts = [];
    for (let n = 0; n < meldSize(m.kind); n++) ts.push(m.tile);
    mtiles.appendChild(chipEl(KIND_CN[m.kind], ts, () => { o.melds.splice(j, 1); renderSeats(); }));
  });
  mz.appendChild(mtiles);
  seat.appendChild(mz);
  // 牌河
  const rz = zone("牌河", undoClr(() => o.river.pop(), () => { o.river = []; renderSeats(); }));
  const rtiles = document.createElement("div");
  rtiles.className = "tiles";
  o.river.forEach((t, j) => rtiles.appendChild(pBtn(t, () => { o.river.splice(j, 1); renderSeats(); })));
  rz.appendChild(rtiles);
  seat.appendChild(rz);
  return seat;
}

function undoClr(undo, clr){
  const w = document.createElement("span");
  const u = document.createElement("button");
  u.className = "mini-undo"; u.textContent = "撤回";
  u.onclick = (e) => { e.stopPropagation(); undo(); };
  const c = document.createElement("button");
  c.className = "mini-undo"; c.textContent = "清空";
  c.onclick = (e) => { e.stopPropagation(); clr(); };
  w.appendChild(u); w.appendChild(c);
  return w;
}

function renderMySeat(){
  const seat = document.createElement("div");
  seat.className = "seat me";
  const head = document.createElement("div");
  head.className = "seat-head";
  const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = "我";
  head.appendChild(nm);
  head.appendChild(queSelect(myQue, v => { myQue = v; scheduleAna(); }));
  const cnt = document.createElement("span"); cnt.className = "meta";
  cnt.id = "mycnt";
  head.appendChild(cnt);
  const clr = document.createElement("button");
  clr.className = "mini-undo"; clr.textContent = "全清";
  clr.onclick = clearAll;
  head.appendChild(clr);
  seat.appendChild(head);
  // 手牌
  const hz = zone("手牌（点我移除）");
  const ht = document.createElement("div");
  ht.className = "tiles"; ht.id = "myhand";
  hz.appendChild(ht);
  seat.appendChild(hz);
  // 副露
  const mz = zone("副露", undoClr(() => { myMelds.pop(); renderSeats(); }, () => { myMelds = []; renderSeats(); }));
  const mt = document.createElement("div");
  mt.className = "tiles";
  myMelds.forEach((m, j) => {
    const ts = [];
    for (let n = 0; n < meldSize(m.kind); n++) ts.push(m.tile);
    mt.appendChild(chipEl(KIND_CN[m.kind], ts, () => { myMelds.splice(j, 1); renderSeats(); }));
  });
  mz.appendChild(mt);
  seat.appendChild(mz);
  // 牌河
  const rz = zone("牌河", undoClr(() => { myRiver.pop(); renderSeats(); }, () => { myRiver = []; renderSeats(); }));
  const rt = document.createElement("div");
  rt.className = "tiles";
  myRiver.forEach((t, j) => rt.appendChild(pBtn(t, () => { myRiver.splice(j, 1); renderSeats(); })));
  rz.appendChild(rt);
  seat.appendChild(rz);
  return seat;
}

function renderSeats(){
  const box = document.getElementById("seats");
  box.innerHTML = "";
  box.appendChild(renderOppSeat(0));
  box.appendChild(renderOppSeat(1));
  box.appendChild(renderOppSeat(2));
  box.appendChild(renderMySeat());
  // 我的手牌 + 计数
  const ht = document.getElementById("myhand");
  hand.forEach((t, i) => ht.appendChild(pBtn(t, () => { hand.splice(i, 1); renderSeats(); })));
  const idle = expectedIdle();
  document.getElementById("mycnt").textContent = `手牌 ${hand.length} 张（应 ${idle} 或 ${idle + 1}）`;
  renderBeliefs();
  renderPalette();
  persist();
}

// ---------- 信念渲染（对手手牌区） ----------
function renderBeliefs(){
  for (let i = 0; i < 3; i++){
    const bg = document.getElementById("belief" + i);
    const ml = document.getElementById("mapline" + i);
    if (!bg) continue;
    bg.innerHTML = ""; ml.innerHTML = "";
    const b = opps[i].belief;
    if (!b){ 
      bg.innerHTML = '<span class="meta">— 尚无推断 —</span>';
      continue;
    }
    const marg = b.marginals;
    for (let s = 0; s < 3; s++){
      if (s > 0){ const br = document.createElement("div"); br.style.height = "4px"; bg.appendChild(br); }
      const row = document.createElement("div"); row.className = "bg-row";
      for (let r = 0; r < 9; r++){
        const t = s * 9 + r;
        const e = marg[t];
        const cell = document.createElement("div");
        cell.className = "bg-cell" + (e < 0.02 ? " na" : "");
        cell.style.background = e < 0.02 ? "" : `rgba(76,120,168,${Math.min(1, 0.18 + e / 4 * 0.82)})`;
        cell.textContent = tileFace(t);
        cell.title = `${tileName(t)} 期望 ${e.toFixed(2)} 张`;
        const es = document.createElement("span"); es.className = "e"; es.textContent = e.toFixed(1);
        cell.appendChild(es);
        row.appendChild(cell);
      }
      bg.appendChild(row);
    }
    const lab = document.createElement("span"); lab.className = "meta"; lab.textContent = "MAP：";
    ml.appendChild(lab);
    b.map_hand.forEach(t => ml.appendChild(pBtn(t)));
  }
}

// ---------- 底部牌盘 ----------
function renderPalette(){
  const box = document.getElementById("ptiles");
  box.innerHTML = "";
  const hot = new Set(), cut = new Set();
  if (lastAna){
    if (lastAna.draw_rank) lastAna.draw_rank.slice(0, 3).forEach(x => hot.add(x.draw));
    if (lastAna.recommend && lastAna.recommend.discard != null) cut.add(lastAna.recommend.discard);
  }
  const dg = (t) => {
    if (!lastDanger) return "";
    const d = lastDanger.tiles[t];
    return d > 0.15 ? " dg4" : d > 0.10 ? " dg3" : d > 0.05 ? " dg2" : d > 0.02 ? " dg1" : "";
  };
  for (let s = 0; s < 3; s++){
    const row = document.createElement("div");
    row.className = "prow";
    const lab = document.createElement("span");
    lab.className = "suitlab"; lab.textContent = SUITS[s];
    row.appendChild(lab);
    for (let r = 0; r < 9; r++){
      const t = s * 9 + r;
      const left = 4 - visibleCnt(t);
      const b = document.createElement("button");
      b.className = "tp" + (left <= 0 ? " zero" : "") + (hot.has(t) ? " hot" : "") + (cut.has(t) ? " cut" : "") + dg(t);
      b.dataset.tile = t;
      b.innerHTML = `${tileFace(t)}<span class="cnt">${left}</span>`;
      b.title = `${tileName(t)} 余 ${left}` + (lastDanger ? ` · 危险度 ${(lastDanger.tiles[t] * 100).toFixed(0)}%` : "");
      b.onclick = () => tapTile(t);
      row.appendChild(b);
    }
    box.appendChild(row);
  }
}

// ---------- 输入路由 ----------
function setMode(m){
  mode = m;
  document.querySelectorAll("#modes button").forEach(x => x.classList.toggle("on", x.dataset.m === m));
  document.getElementById("meldCfg").classList.toggle("show", m === "meld");
}
function tapTile(t){
  if (game && gameTap(t)) return;
  if (mode === "hand"){
    const idle = expectedIdle();
    if (hand.length >= idle + 1){ flashRec(`手牌已满 ${idle + 1} 张：点手牌区一张打出/移除后再录`); return; }
    if (hand.filter(x => x === t).length >= 4){ flashRec("同种牌最多 4 张"); return; }
    hand.push(t); hand.sort((a, b) => a - b);
  } else if (mode === "myriver"){
    myRiver.push(t);
  } else if (mode.startsWith("or")){
    const i = +mode.slice(2);
    opps[i].river.push(t);
  } else if (mode === "meld"){
    const seat = document.getElementById("meldSeat").value;
    const kind = document.getElementById("meldKind").value;
    if (seat === "me"){
      if (myMelds.length >= 4){ flashRec("自家副露不超过 4 组"); return; }
      myMelds.push({kind, tile: t});
      // 副露来源张自动从手牌扣除（碰2/杠3/暗杠4/加杠1）——合并处理的正确口径
      const need = kind === "peng" ? 2 : kind === "gang" ? 3 : kind === "angang" ? 4 : 1;
      const have = hand.filter(x => x === t).length;
      if (have >= need){
        for (let n = 0; n < need; n++) hand.splice(hand.indexOf(t), 1);
      } else if (kind !== "jiagang"){
        flashRec(`已记${KIND_CN[kind]}：手牌 ${tileName(t)} 不足 ${need} 张，请手动调整`);
      }
    } else {
      const o = opps[+seat];
      if (o.melds.length >= 4){ flashRec("该家副露不超过 4 组"); return; }
      o.melds.push({kind, tile: t});
    }
  }
  renderSeats();
  scheduleAna();
  scheduleInfer();
}

function clearAll(){
  hand = []; myMelds = []; myRiver = [];
  opps.forEach(o => { o.river = []; o.melds = []; o.belief = null; });
  lastAna = null; lastDanger = null;
  document.getElementById("plans").innerHTML = "";
  renderSeats();
}

// ---------- 本地存档 ----------
function persist(){
  try {
    localStorage.setItem("mj_v3", JSON.stringify({
      hand, myMelds, myRiver,
      opps: opps.map(o => ({river: o.river, melds: o.melds, que: o.que})),
      myQue, mode,
    }));
  } catch (e) {}
}
(function restore(){
  try {
    const s = JSON.parse(localStorage.getItem("mj_v3") || "null");
    if (!s) return;
    hand = s.hand || []; myMelds = s.myMelds || []; myRiver = s.myRiver || [];
    (s.opps || []).forEach((o, i) => { opps[i].river = o.river || []; opps[i].melds = o.melds || []; opps[i].que = o.que ?? null; });
    myQue = s.myQue ?? null;
    if (s.mode) mode = s.mode;
  } catch (e) {}
})();

// ---------- 分析（PWA 钩子：window._analyzeJson） ----------
let anaTimer = null, inferTimer = null;
function scheduleAna(){ clearTimeout(anaTimer); anaTimer = setTimeout(runAna, 500); }
function scheduleInfer(){ clearTimeout(inferTimer); inferTimer = setTimeout(runInfer, 1300); }
function handValid(){
  const idle = expectedIdle();
  return hand.length === idle || hand.length === idle + 1;
}
function flashRec(msg){
  lastRecText = msg;
  updateBanner();
}
function updateBanner(){
  let warn = "";
  if (lastDanger){
    const hot = lastDanger.opponents.map((o, i) => o.tenpai ? OPP_CN[i] : null).filter(Boolean);
    if (hot.length){
      const waitsTxt = lastDanger.opponents
        .map((o, i) => o.tenpai && o.waits.length ? `${OPP_CN[i]}听${o.waits.map(w => tileFace(w)).join("")}` : "")
        .filter(Boolean).join(" · ");
      warn = ` ⚠${hot.join("/")}疑似听牌（${waitsTxt}） `;
    }
  }
  document.getElementById("rec").textContent = warn ? warn + "｜ " + lastRecText : lastRecText;
}

async function callAnalyze(payload){
  if (window._analyzeJson) return window._analyzeJson(payload);
  const resp = await fetch("/api/analyze", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify(payload)});
  return resp.json();
}
async function callInfer(payload){
  if (window._inferJson) return window._inferJson(payload);
  const resp = await fetch("/api/infer", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify(payload)});
  return resp.json();
}

async function runAna(){
  if (!handValid()){
    const idle = expectedIdle();
    flashRec(`手牌 ${hand.length} 张（应 ${idle} 或 ${idle + 1}）· 继续录入`);
    document.getElementById("banner").style.background = "#fff7f0";
    return;
  }
  document.getElementById("banner").style.background = "";
  const btn = document.getElementById("go");
  btn.disabled = true;
  const t0 = performance.now();
  try {
    const data = await callAnalyze({
      tiles: hand,
      que: myQue,
      k: +document.getElementById("k").value,
      melds: myMelds,
    });
    if (data.error){ flashRec("分析失败：" + data.error); return; }
    lastAna = data;
    showAna(data, performance.now() - t0);
  } catch (e) {
    flashRec("分析失败：" + e.message);
  } finally {
    btn.disabled = false;
    renderPalette();
  }
}

function showAna(data, ms){
  const r = data.recommend;
  const dtxt = r.discard != null ? ` · 切 ${tileFace(r.discard)}${tileName(r.discard)}` : "";
  flashRec(`推荐 ${PLAN_CN[r.plan]}（EV ${r.ev.toFixed(2)}）${dtxt}`);
  document.getElementById("lat").textContent =
    `结构：对子×${data.features.n_pairs} 强门 ${data.features.n_max} 张 · 定缺${SUITS[data.que]} · ${ms.toFixed(0)}ms`;
  const maxEv = Math.max(...data.plans.map(p => p.ev), 0.01);
  const box = document.getElementById("plans");
  box.innerHTML = "";
  data.plans.forEach(p => {
    const best = p.plan === r.plan;
    const card = document.createElement("div");
    card.className = "plan-card" + (best ? " best" : "");
    const d = p.discard != null ? `切 ${tileFace(p.discard)}${tileName(p.discard)}` : `向听 ${p.shanten}`;
    card.innerHTML = `
      <div class="plan-head">
        <span style="color:${PLAN_CSS[p.plan]}">${PLAN_CN[p.plan]}${best ? " ★" : ""}</span>
        <span>EV ${p.ev.toFixed(2)} ｜ 胡牌率 ${(p.win_rate * 100).toFixed(0)}% ｜ ${d}</span>
      </div>
      <div class="bar-wrap"><div class="bar" style="width:${Math.max(2, p.ev / maxEv * 100)}%;background:${PLAN_CSS[p.plan]}"></div></div>`;
    box.appendChild(card);
  });
  if (data.discard_rank && data.discard_rank.length){
    box.appendChild(rankBox("切牌 EV 排行（" + PLAN_CN[r.plan] + "）", data.discard_rank, x => x.discard, "#e2a09a"));
  }
  if (data.draw_rank && data.draw_rank.length){
    box.appendChild(rankBox(`等张榜 · 总进张 ${data.wait_total} 张（在等的牌，按余张排序）`,
      data.draw_rank, x => x.draw, "#9ec9a0", x => `（余${x.left}）`));
  }
}
function rankBox(title, rows, tileOf, color, extra){
  const w = document.createElement("div");
  const lab = document.createElement("div");
  lab.className = "meta"; lab.style.margin = "8px 0 2px"; lab.textContent = title;
  w.appendChild(lab);
  const maxEv = Math.max(...rows.map(x => x.ev), 0.01);
  rows.forEach(x => {
    const row = document.createElement("div");
    row.className = "rank-row";
    const t = tileOf(x);
    row.innerHTML = `<span>${tileFace(t)}${tileName(t)}</span>
      <span class="barw"><span class="barf" style="display:block;width:${Math.max(2, x.ev / maxEv * 100)}%;background:${color}"></span></span>
      <span>${x.ev.toFixed(2)}${extra ? extra(x) : ""}</span>`;
    w.appendChild(row);
  });
  return w;
}

// ---------- 读牌（对手手牌区自动更新） ----------
async function runInfer(){
  if (!handValid()) return;
  document.getElementById("status").textContent = "读牌中…";
  try {
    const data = await callInfer({
      tiles: hand,
      melds: myMelds,
      opp_melds: opps.map(o => o.melds),
      rivers: opps.map(o => o.river),
      my_river: myRiver,
      ques: opps.map(o => o.que),
      k: +document.getElementById("ki").value,
    });
    if (data.error){ document.getElementById("status").textContent = "读牌失败：" + data.error; return; }
    lastDanger = data.danger || null;
    data.opponents.forEach((b, i) => {
      opps[i].belief = b;
      const m = document.getElementById("ometa" + i);
      if (m){
        const info = lastDanger && lastDanger.opponents[i];
        m.innerHTML = info && info.tenpai
          ? `<span class="tenpai-badge">⚠ 疑似听牌 ${(info.conf * 100).toFixed(0)}% ｜ 听 ${info.waits.map(w => tileFace(w)).join(" ")}</span> ｜ neff ${b.neff}`
          : `有效样本 ${b.neff} ｜ MAP权重 ${b.map_weight}`;
      }
    });
    renderBeliefs();
    renderPalette();
    updateBanner();
    document.getElementById("status").textContent = "读牌✓ " + new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById("status").textContent = "读牌失败：" + e.message;
  }
}

// ---------- 对局记录（A1：动作流水 → RecorderSession → M 记录） ----------
// 会话座位：0=我，1=下家，2=对家，3=上家（轮转顺序）；显示桶 opps[对,下,上]
const OPP_OF_SEAT = {1: 1, 2: 0, 3: 2};
const SEAT_OF_OPP = {0: 2, 1: 1, 2: 3};
let game = null; // {dealer, actions, st, gmode, pending, my0, myQue}

async function callRec(payload, which){
  const path = "/api/rec/" + which;
  if (which === "state" && window._recStateJson) return window._recStateJson(payload);
  if (which === "export" && window._recExportJson) return window._recExportJson(payload);
  const resp = await fetch(path, {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify(payload)});
  return resp.json();
}

function startGame(){
  if (game) return;
  if (hand.length !== 13){ flashRec("新开一局需先录好开局 13 张手牌（我·手牌模式）"); return; }
  if (myQue === null){ flashRec("请先在“我”卡上选定缺"); return; }
  const my0 = hand.slice();
  const actions = [];
  // 对手定缺登记（取各家卡上的选择；未选=未知，会话允许 None）
  for (let i = 0; i < 3; i++){
    if (opps[i].que !== null) actions.push({op: "que", seat: SEAT_OF_OPP[i], que: opps[i].que});
  }
  game = {dealer: +document.getElementById("gdealer").value, actions, st: null,
          gmode: "medraw", pending: null, my0, myQue};
  document.getElementById("gameSec").open = true;
  document.getElementById("modes").style.display = "none";
  document.getElementById("meldCfg").classList.remove("show");
  flashRec("对局开始：按轮转录入（我摸→我出→各家出…）");
  renderGameBar();
  recSync();
}
function exitGame(){
  game = null;
  document.getElementById("gbar").innerHTML = "";
  document.getElementById("gout").innerHTML = "";
  document.getElementById("modes").style.display = "";
  renderPalette();
}

function lastDiscardTile(){
  for (let i = game.actions.length - 1; i >= 0; i--){
    const a = game.actions[i];
    if (a.op === "me_discard" || a.op === "opp_discard") return a.tile;
  }
  return null;
}

function gameTap(t){
  if (!game) return false;
  if (game.pending){
    const p = game.pending; game.pending = null;
    if (p.kind === "angang") game.actions.push({op: "call", seat: 0, tile: t, kind: "angang", kong: t});
    else if (p.kind === "jiagang") game.actions.push({op: "call", seat: 0, tile: t, kind: "jiagang", kong: t});
    else if (p.kind === "zimo") game.actions.push({op: "win", seat: p.seat, tile: t, mode: "zimo"});
  } else if (game.gmode === "medraw"){
    game.actions.push({op: "me_draw", tile: t});
  } else if (game.gmode === "mdiscard"){
    game.actions.push({op: "me_discard", tile: t});
  } else {
    game.actions.push({op: "opp_discard", seat: SEAT_OF_OPP[game.gmode.slice(2)], tile: t});
  }
  renderGameBar();
  recSync();
  return true;
}

function gameAct(kind){
  const st = game.st;
  if (kind === "huangzhuang"){
    game.actions.push({op: "huangzhuang"});
  } else if (kind === "peng" || kind === "daming"){
    const seat = +document.getElementById("gcallSeat").value;
    const t = lastDiscardTile();
    if (t === null){ flashRec("尚无舍牌可鸣"); return; }
    game.actions.push({op: "call", seat, tile: t, kind});
  } else if (kind === "rong"){
    const seat = +document.getElementById("gcallSeat").value;
    const t = lastDiscardTile();
    if (t === null){ flashRec("点炮需有上一张舍牌"); return; }
    game.actions.push({op: "win", seat, tile: t, mode: "rong"});
  } else if (kind === "zimo"){
    game.pending = {kind: "zimo", seat: +document.getElementById("gcallSeat").value};
  } else if (kind === "angang" || kind === "jiagang"){
    game.pending = {kind};
  }
  renderGameBar();
  recSync();
}

let recTimer = null;
function recSync(){
  clearTimeout(recTimer);
  recTimer = setTimeout(recSend, 250);
}
async function recSend(){
  if (!game) return;
  const payload = {my_tiles: game.my0, my_que: game.myQue, dealer: game.dealer, actions: game.actions};
  try {
    const data = await callRec(payload, "state");
    if (data.error){
      const bad = game.actions.pop(); // 回滚非法动作
      renderGameBar();
      flashRec(`记录拒绝：${data.error}`);
      return;
    }
    game.st = data.state;
    syncFromSession();
    renderSeats();
    renderGameBar();
    scheduleAna();
    scheduleInfer();
  } catch (e) {
    flashRec("记录同步失败：" + e.message);
  }
}

function expandTiles(counts){
  const out = [];
  for (let t = 0; t < 27; t++) for (let n = 0; n < counts[t]; n++) out.push(t);
  return out;
}
function syncFromSession(){
  const st = game.st;
  hand = expandTiles(st.my_hand);
  myMelds = st.my_melds.map(m => ({kind: m[0], tile: m[1]}));
  myRiver = Array.from(st.rivers[0]);
  for (let i = 0; i < 3; i++){
    const seat = SEAT_OF_OPP[i];
    opps[i].river = Array.from(st.rivers[seat]);
    opps[i].melds = st.melds[seat].map(m => ({kind: m[0], tile: m[1]}));
  }
}

function renderGameBar(){
  const bar = document.getElementById("gbar");
  if (!game){ bar.innerHTML = ""; return; }
  const st = game.st;
  bar.innerHTML = "";
  const row1 = document.createElement("div");
  row1.style.cssText = "display:flex;gap:4px;flex-wrap:wrap;margin:4px 0";
  const modes = [["medraw", "我摸"], ["mdiscard", "我出"], ["or1", "下出"], ["or0", "对出"], ["or2", "上出"]];
  modes.forEach(([m, n]) => {
    const b = document.createElement("button");
    b.className = "mini-undo";
    b.style.cssText = "border:1px solid var(--line);border-radius:7px;padding:7px 10px" + (game.gmode === m ? ";background:#4c78a8;color:#fff" : "");
    b.textContent = n;
    b.onclick = () => { game.gmode = m; game.pending = null; renderGameBar(); };
    row1.appendChild(b);
  });
  bar.appendChild(row1);
  // 动作按钮行
  const row2 = document.createElement("div");
  row2.style.cssText = "display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin:4px 0";
  const seatSel = document.createElement("select");
  seatSel.id = "gcallSeat";
  [["0", "我"], ["1", "下家"], ["2", "对家"], ["3", "上家"]].forEach(([v, n]) => {
    const o = document.createElement("option"); o.value = v; o.textContent = n; seatSel.appendChild(o);
  });
  row2.appendChild(seatSel);
  const acts = [["peng", "碰"], ["daming", "明杠"], ["angang", "暗杠"], ["jiagang", "加杠"], ["rong", "点炮胡"], ["zimo", "自摸"], ["huangzhuang", "荒庄"]];
  const sg = st ? st.suggestions : {};
  acts.forEach(([k, n]) => {
    const b = document.createElement("button");
    b.className = "mini-undo";
    const hot = (k === "peng" && sg.can_peng) || (k === "daming" && sg.can_daming)
      || (k === "rong" && sg.can_rong) || (k === "zimo" && sg.can_zimo)
      || ((k === "angang") && sg.can_angang && sg.can_angang.length)
      || ((k === "jiagang") && sg.can_jiagang && sg.can_jiagang.length);
    b.style.cssText = "border:1px solid var(--line);border-radius:7px;padding:7px 10px" + (hot ? ";border-color:#e45756;box-shadow:0 0 0 2px rgba(228,87,86,.35)" : "");
    b.textContent = n;
    b.onclick = () => gameAct(k);
    row2.appendChild(b);
  });
  bar.appendChild(row2);
  // 状态行
  const row3 = document.createElement("div");
  row3.className = "meta";
  if (st){
    const turn = st.turn === -1 ? (st.suggestions && Object.keys(st.suggestions).length === 0 && st.done ? "终局" : "响应中")
      : (st.turn === 0 ? "轮到我" : "轮到" + gameSeatName(st.turn));
    row3.textContent = `动作 ${game.actions.length} ｜ ${turn} ｜ 余墙 ${st.wall_left}` +
      (st.done ? " ｜ 本局结束，可导出" : "") +
      (game.pending ? ` ｜ ⏳ 请选择${{angang: "暗杠", jiagang: "加杠", zimo: "自摸"}[game.pending.kind]}的牌` : "");
  } else {
    row3.textContent = "同步中…";
  }
  bar.appendChild(row3);
  // 导出按钮
  if (st && st.done){
    const ex = document.createElement("button");
    ex.className = "mini-undo";
    ex.style.cssText = "border:1px solid #4c78a8;border-radius:7px;padding:8px 14px;color:#4c78a8;font-weight:700;margin-top:4px";
    ex.textContent = "📤 导出 M 记录";
    ex.onclick = recExport;
    bar.appendChild(ex);
  }
}
function gameSeatName(s){ return s === 0 ? "我" : OPP_CN[OPP_OF_SEAT[s]]; }

async function recExport(){
  const payload = {my_tiles: game.my0, my_que: game.myQue, dealer: game.dealer, actions: game.actions, k: 300};
  const out = document.getElementById("gout");
  out.innerHTML = '<div class="meta">导出中（信念重建三家手牌+回填牌山，可能数秒）…</div>';
  try {
    const data = await callRec(payload, "export");
    if (data.error){ out.innerHTML = `<div class="meta" style="color:#b3382f">导出失败：${data.error}</div>`; return; }
    const ta = document.createElement("textarea");
    ta.readOnly = true;
    ta.style.cssText = "width:100%;height:90px;font-size:.75rem";
    ta.value = data.record;
    const cp = document.createElement("button");
    cp.className = "mini-undo";
    cp.style.cssText = "border:1px solid var(--line);border-radius:7px;padding:7px 12px;margin-top:4px";
    cp.textContent = "复制记录";
    cp.onclick = () => { ta.select(); navigator.clipboard?.writeText(ta.value); cp.textContent = "已复制"; };
    out.innerHTML = "";
    out.appendChild(ta);
    out.appendChild(cp);
  } catch (e) {
    out.innerHTML = `<div class="meta" style="color:#b3382f">导出失败：${e.message}</div>`;
  }
}
